<!doctype html>
<html lang="en">
  <head>
    <style>@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap');</style>
  </head>
  <body style="margin:0;background:#f6f8f7;font-family:'Outfit',sans-serif;color:#171a19">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding:32px 16px">
      <tr><td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:480px;background:#fff;border-radius:16px;padding:32px">
          <tr><td>
            <h1 style="margin:0 0 16px;font-size:24px">Your Kouponly verification code</h1>
            <p style="margin:0 0 24px;color:#555d5a">Enter this six-digit code in the app to verify your email address.</p>
            <p style="margin:0 0 24px;text-align:center;font-size:32px;font-weight:700;letter-spacing:8px">{{ .Token }}</p>
            <p style="margin:0;color:#68716d;font-size:14px">This code expires soon. If you did not request it, you can ignore this email.</p>
          </td></tr>
        </table>
      </td></tr>
    </table>
  </body>
</html>
